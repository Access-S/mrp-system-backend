services:
  - type: web
    name: mrp-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://your-frontend.onrender.com
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: mrp-kpi-snapshot
    env: node
    region: oregon
    plan: free
    schedule: "59 12 * * *"
    buildCommand: npm ci && npm run build
    startCommand: node -e "fetch('https://mrp-1.onrender.com/api/snapshots/auto', {method:'POST', headers:{'x-cron-secret':process.env.CRON_SECRET}}).then(r=>r.json()).then(d=>{console.log(JSON.stringify(d));process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: CRON_SECRET
        sync: false